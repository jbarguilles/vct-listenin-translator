<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Listen-in Translator</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Listen-in Translator</h1>

    <form id="keys-form">
      <label>
        Gladia API key
        <input id="gladia-key" type="password" autocomplete="new-password" spellcheck="false" />
      </label>
      <label>
        Anthropic API key
        <input id="anthropic-key" type="password" autocomplete="new-password" spellcheck="false" />
      </label>
      <button id="save-keys" type="submit">Save keys</button>
      <p id="saved" class="note" role="status"></p>
      <p class="note">Keys stay in this browser and are sent only to Gladia and Anthropic.</p>
    </form>

    <section>
      <button id="arm" type="button" disabled>Arm</button>
      <p id="hint"></p>
      <p id="error" role="alert"></p>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
